<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Storyfolio · 经历与简历工作台</title><link rel="stylesheet" href="/style.css"></head>
<body>
<div id="shell">
  <aside class="sidebar">
    <a class="brand" href="/">Storyfolio<span>把经历，写成下一步。</span></a>
    <div class="nav-caption">我的工作空间</div>
    <nav>
      <button data-nav="stories"><span>01</span> 原始故事 <b id="story-count">0</b></button>
      <button data-nav="library"><span>02</span> 我的经历库</button>
      <button data-nav="resumes"><span>03</span> 简历工作室 <b id="resume-count">0</b></button>
    </nav>
    <div class="sidebar-note"><div class="dot"></div><strong>故事始终保留</strong><p>从真实的经历出发，<br>为不同机会写出不同侧面。</p></div>
    <nav class="bottom-nav"><button data-nav="settings"><span>⚙</span> 模型与同步</button></nav>
    <div class="local-badge"><i></i> 本地工作空间</div>
  </aside>
  <main>
    <header><div id="breadcrumb">我的工作空间 / 原始故事</div><div class="header-actions"><span id="save-status">正在打开…</span><button class="subtle" data-action="backup">下载完整备份</button><button data-action="push" class="sync-btn">↑ 同步 GitHub</button></div></header>
    <div id="view"><div class="empty">正在读取本地资料…</div></div>
  </main>
</div>
<dialog id="dialog"></dialog><div id="toast" role="status" aria-live="polite"></div><div id="print-only"></div>
<input type="file" id="file-input" hidden accept=".md,.txt,.json">
<script type="module" src="/app.js"></script>
</body></html>
